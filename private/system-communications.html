<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MadeDeck Communications</title><link rel="stylesheet" href="/system-communications-admin.css"></head><body>
<header><div><small>MADEDECK CONTROL PLANE</small><h1>System Communications</h1><p>Publish once to the website and Windows app.</p></div><a href="/api/swarm-power/ui">Back to Power Console</a></header>
<main>
  <section class="composer"><h2>New message</h2><div class="grid"><label>Title<input id="title"></label><label>Type<select id="type"><option>general</option><option>release_note</option><option>maintenance</option><option>outage</option><option>upgrade</option><option>security</option><option>billing</option><option>promotion</option></select></label><label>Severity<select id="severity"><option>info</option><option>success</option><option>warning</option><option>critical</option></select></label><label>Display<select id="presentation"><option>banner</option><option>toast</option><option>modal</option><option>fullscreen</option><option>inbox</option></select></label><label class="wide">Message<textarea id="body" rows="4"></textarea></label><label>Starts<input id="starts" type="datetime-local"></label><label>Ends<input id="ends" type="datetime-local"></label><label>Countdown to<input id="countdown" type="datetime-local"></label><label>Audience<select id="audience"><option value="all">Everyone</option><option value="signed">Signed-in users</option><option value="pro">Pro</option><option value="advanced">Advanced</option><option value="command">Command Center</option><option value="admin">Vinny/admin</option></select></label></div><div class="checks"><label><input id="dismissible" type="checkbox" checked> Dismissible</label><label><input id="ack" type="checkbox"> Require acknowledgment</label><label><input id="publish" type="checkbox"> Publish immediately</label></div><button id="send">Save message</button><span id="result"></span></section>
  <section><div class="section-head"><h2>Messages</h2><button id="refresh">Refresh</button></div><div id="messages" class="list"></div></section>
  <section><div class="section-head"><h2>System status</h2></div><div id="components" class="components"></div></section>
</main><script src="/system-communications-admin.js"></script></body></html>
